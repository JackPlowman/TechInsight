name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clean-caches:
    name: Clean Caches
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required to delete this repository's Actions caches
    steps:
      - name: Delete caches
        run: gh cache delete --all --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
